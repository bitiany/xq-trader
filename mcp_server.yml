# xqtrader OpenAPI -> MCP 通用转换器配置
# 默认启动后会从 source.url 拉取 OpenAPI，对每个 group 暴露一个独立 SSE 端点：
#   /sse                 -> default_group
#   /sse/<group_name>    -> 对应分组

server:
  name: xqtrader
  transport: sse
  host: 127.0.0.1
  port: 8097
  routes_prefix: /sse
  default_group: stocks
  tool_name_prefix: xq_

source:
  type: http
  url: http://127.0.0.1:8096/openapi.json
  api_base_url: http://127.0.0.1:8096
  refresh_interval: 0

invoker:
  timeout_seconds: 30
  max_keepalive_connections: 32
  unwrap_response_data: true

# 全局黑名单（任何 group 都不会暴露）
# 各 group 使用 include 白名单，仅暴露显式声明的 operation_id
deny:
  - path_glob: /api/v1/agent/**

groups:
  stocks:
    title: 个股研究
    description: 个股行情、估值、技术面、资金流向、新闻公告
    include:
      - operation_id: search_stocks
      - operation_id: get_stock_overview
      - operation_id: get_stock_technical
      - operation_id: get_stock_chanlun
      - operation_id: get_stock_valuation
      - operation_id: get_stock_financials
      - operation_id: get_stock_fund_flow
      - operation_id: get_stock_news
      - operation_id: get_stock_announcements
    tools:
      get_stock_fund_flow:
        description: |
          查询个股最近 5 个交易日资金流（Agent 视图）。
          字段约定：「主力净流入占比_百分比」正=净流入、负=净流出；禁止将大单/超大单占比当作主力。
          仅含 Tushare 原始占比字段，不含 EMA 资金博弈字段（huge_net_inflow_pct 等）。
        invoke:
          defaults:
            limit: 5
          hide_params:
            - limit
        response:
          jmespath: >-
            {
              "标的代码": symbol,
              "最新一日": items[-1].{
                "交易日期": trade_date,
                "收盘价": close,
                "主力净流入额_万元": main_net_amt,
                "主力净流入占比_百分比": main_net_pct,
                "超大单净流入额_万元": huge_net_amt,
                "超大单净流入占比_百分比": huge_net_pct,
                "大单净流入额_万元": big_net_amt,
                "大单净流入占比_百分比": big_net_pct
              },
              "近5日主力占比趋势": items[-5:].{
                "交易日期": trade_date,
                "主力净流入占比_百分比": main_net_pct,
                "超大单净流入占比_百分比": huge_net_pct,
                "大单净流入占比_百分比": big_net_pct
              }
            }

  factors:
    title: 因子研究
    description: 平台活跃因子宽表时序（单工具）
    include:
      - operation_id: get_stock_factor_series

  strategies:
    title: 策略与规则
    description: 策略、规则组、规则绑定
    include:
      - operation_id: list_strategies
      - operation_id: get_strategy
      - operation_id: list_strategy_rule_groups
      - operation_id: list_rule_group_bindings
      - operation_id: list_rules
      - operation_id: get_rule

  selection:
    title: 选股与样本池
    description: 样本池、选股结果与日期
    include:
      - operation_id: list_universe_pools
      - operation_id: get_universe_pool_symbols
      - operation_id: list_selection_results
      - operation_id: list_selection_result_dates

  positions:
    title: 持仓盘点
    description: 持仓、资产、订单与成交（仅只读）
    include:
      - operation_id: list_broker_positions
      - operation_id: get_broker_position
      - operation_id: get_broker_asset
      - operation_id: list_broker_orders
      - operation_id: list_broker_trades

  indices:
    title: 指数行情
    description: 指数列表、概览与日K线（含技术指标）
    include:
      - operation_id: list_indices
      - operation_id: get_index_overview
      - operation_id: get_index_kline

  research:
    title: 券商研报
    description: 个股研报列表与详情（机构/评级/盈利预测/摘要）
    include:
      - operation_id: list_stock_research_reports
      - operation_id: get_research_report

  sentiment:
    title: 舆情快照
    description: 市场级与个股级舆情快照（热度/情感分/正负面提及数）
    include:
      - operation_id: get_market_sentiment
      - operation_id: get_stock_sentiment

  research_thesis:
    title: 投研论点卡
    description: 个股基本面慢变量结论（五步法产物）的读写与失效管理
    include:
      - operation_id: get_stock_thesis
      - operation_id: save_stock_thesis
      - operation_id: mark_thesis_stale

  investor_profile:
    title: 投资者画像
    description: 全局投资偏好与自选股配置
    include:
      - operation_id: get_preference
