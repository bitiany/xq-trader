# xqtrader Agent + MCP 联合部署（推荐）
#
# 前置条件（宿主机）：
#   - xqtrader API 已监听 8096（供 MCP 拉 OpenAPI、Agent 入队）
#   - LLM 已监听宿主机 8000（容器经 host.docker.internal 访问）
#   - TEI 嵌入服务已监听宿主机 6380（bge-large-zh-v1.5）
#   - Qdrant 已监听宿主机 56333/56334
#   - Redis / PostgreSQL 隧道在宿主机监听时，容器须经 host.docker.internal 访问
#
# 用法（在项目根目录）：
#   docker compose -f docker/docker-compose.yml up -d --build
#   docker compose -f docker/docker-compose.yml logs -f mcp agent
#   docker compose -f docker/docker-compose.yml down
#
# 网络：
#   Agent → MCP：http://mcp:8097（Docker 内网）
#   MCP / Agent → API / LLM：http://host.docker.internal（宿主机）

name: xqtrader

networks:
  default:
    name: xqtrader-net

services:
  mcp:
    build:
      context: ..
      dockerfile: docker/mcp/Dockerfile
    container_name: xqtrader-mcp
    ports:
      - "8097:8097"
    environment:
      MCP_SERVER_HOST: "0.0.0.0"
      MCP_SERVER_PORT: "8097"
      MCP_OPENAPI_URL: http://host.docker.internal:8096/openapi.json
      MCP_API_BASE_URL: http://host.docker.internal:8096
    volumes:
      - ../mcp_server.yml:/config/mcp_server.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8097),3); s.close()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  agent:
    build:
      context: ..
      dockerfile: docker/agent/Dockerfile
    container_name: xqtrader-agent
    depends_on:
      mcp:
        condition: service_healthy
    environment:
      ENV: /config/.env
      APP_DB_CONFIG_PATH: /config/datasource.yml
      AGENT_WORKSPACE: /workspace
      AGENT_MCP_BASE_URL: http://mcp:8097
      AGENT_SERVICE_BASE_URL: http://host.docker.internal:8096
      AGENT_LLM_BASE_URL: http://host.docker.internal:8000/v1
      AGENT_LLM_MODEL_NAME: "Qwen/Qwen3-235B-A22B-Instruct-2507"
      AGENT_WORKER_ID: worker-1
      AGENT_MAX_CONCURRENT_RUNS: "1"
      AGENT_REDIS_HOST: host.docker.internal
      DATABASES_DEFAULT_HOST: host.docker.internal
      DATABASES_STOCK_HOST: host.docker.internal
      DATABASES_RESEARCH_HOST: host.docker.internal
      DATABASES_TRADING_HOST: host.docker.internal
      QDRANT_HOST: host.docker.internal
      QDRANT_EMBEDDING_BACKEND: tei
      QDRANT_EMBEDDING_TEI_BASE_URL: http://host.docker.internal:6380
    volumes:
      - ../src/agent/workspace:/workspace
      - ../.env:/config/.env:ro
      - ../datasource.yml:/config/datasource.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "fin-qat.vuca.com:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import redis; from agent.config import agent_settings; redis.from_url(agent_settings.REDIS_URL).ping()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
