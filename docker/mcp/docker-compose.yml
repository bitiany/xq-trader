# xqtrader MCP 服务容器部署
#
# 单独启动：
#   docker compose -f docker/mcp/docker-compose.yml up -d --build
#
# 与 Agent 组网联合启动（推荐）：
#   docker compose -f docker/docker-compose.yml up -d --build
#
# 挂载说明：
#   - mcp_server.yml：MCP 分组、OpenAPI 源、工具过滤等配置

networks:
  xqtrader:
    name: xqtrader-net

services:
  mcp:
    build:
      context: ../..
      dockerfile: docker/mcp/Dockerfile
    container_name: xqtrader-mcp
    networks:
      - xqtrader
    ports:
      - "8097:8097"
    environment:
      MCP_SERVER_HOST: "0.0.0.0"
      MCP_SERVER_PORT: "8097"
      MCP_OPENAPI_URL: http://host.docker.internal:8096/openapi.json
      MCP_API_BASE_URL: http://host.docker.internal:8096
    volumes:
      - ../../mcp_server.yml:/config/mcp_server.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
