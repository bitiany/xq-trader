# xqtrader MCP 服务容器部署
#
# 单独启动：
#   docker compose -f docker/mcp/docker-compose.yml up -d --build
#
# 与 Agent 组网联合启动（推荐）：
#   docker compose -f docker/docker-compose.yml up -d --build

networks:
  xqtrader:
    name: xqtrader-net

services:
  mcp:
    build:
      context: ../..
      dockerfile: docker/mcp/Dockerfile
    container_name: xqtrader-mcp
    networks:
      - xqtrader
    ports:
      - "8097:8097"
    environment:
      MCP_SERVER_HOST: "0.0.0.0"
      MCP_SERVER_PORT: "8097"
      MCP_OPENAPI_URL: http://host.docker.internal:8096/openapi.json
      MCP_API_BASE_URL: http://host.docker.internal:8096
    volumes:
      - ../../mcp_server.yml:/config/mcp_server.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8097),3); s.close()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
