[project]
name = "xqtrader"
version = "0.1.0"
description = "Quantitative trading platform API service"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "cryptography>=42.0,<45.0",
    "fastapi>=0.109,<1.0",
    "jsonpath-ng>=1.6,<2.0",
    "jsonschema>=4.20,<5.0",
    "langchain==1.3.2",
    "langgraph==1.2.2",
    "notebook>=7.0,<8.0",
    "nanobot-ai>=0.1.5",
    "neo4j>=5.20,<6.0",
    "pydantic>=2.5,<3.0",
    "pandas>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "redis>=5.0,<6.0",
    "backtrader>=1.9,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "ta-lib==0.6.8",
    "uvicorn[standard]>=0.27,<1.0",
    "xtquant==250516.1.1",
    "xgboost==3.2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8,<2.0",
    "ruff>=0.2,<1.0",
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "pandas-stubs>=2.0,<3.0",
    "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
xqtrader-api = "xqtrader.main:run"

[[tool.uv.index]]
default = true
name = "default"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[tool.setuptools.packages.find]
where = ["src"]
include = ["xqtrader*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["framework", "xqtrader"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["framework", "xqtrader", "skills"]

[[tool.mypy.overrides]]
module = ["psycopg2"]
ignore_missing_imports = true
