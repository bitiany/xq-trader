[project]
name = "xqtrader"
version = "0.1.0"
description = "Quantitative trading platform API service"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "apscheduler>=3.10,<4.0",
    "asyncpg>=0.29,<1.0",
    "akshare>=1.14,<2.0",
    "celery[redis]>=5.4,<6.0",
    "cryptography>=42.0,<45.0",
    "fastapi>=0.109,<1.0",
    "httpx>=0.27,<1.0",
    "jsonpath-ng>=1.6,<2.0",
    "jsonschema>=4.20,<5.0",
    "langchain==1.3.2",
    "langgraph==1.2.2",
    "notebook>=7.0,<8.0",
    "nanobot-ai>=0.1.5",
    "neo4j>=5.20,<6.0",
    "pydantic>=2.5,<3.0",
    "pandas>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "redis>=5.0,<6.0",
    "backtrader>=1.9,<2.0",
    "quantstats>=0.0.62,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "ta-lib==0.6.8",
    "typing_extensions>=4.0,<5.0",
    "tushare>=1.4,<2.0",
    "uvicorn[standard]>=0.27,<1.0",
    "xtquant==250516.1.1; sys_platform == 'win32'",
    "xgboost==3.2.0",
    "mcp>=1.27,<2.0",
    "starlette>=0.36,<1.0",
    "qdrant-client>=1.9,<2.0",
    "sentence-transformers>=2.7,<4.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8,<2.0",
    "ruff>=0.2,<1.0",
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "pandas-stubs>=2.0,<3.0",
    "types-PyYAML>=6.0,<7.0",
]

[dependency-groups]
agent = [
    "nanobot-ai>=0.1.5",
    "redis>=5.0,<6.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "cryptography>=42.0,<45.0",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
    "typing_extensions>=4.0,<5.0",
    "mcp>=1.27,<2.0",
    "qdrant-client>=1.9,<2.0",
    "sentence-transformers>=2.7,<4.0",
]
mcp = [
    "mcp>=1.27,<2.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
    "pyyaml>=6.0,<7.0",
    "uvicorn[standard]>=0.27,<1.0",
    "starlette>=0.36,<1.0",
]

[project.scripts]
xqtrader-api = "xqtrader.main:run"
xqtrader-worker = "worker.celery_entry:run_worker"
xqtrader-beat = "worker.celery_entry:run_beat"
xqtrader-agent = "agent.worker:main"
xqtrader-mcp = "mcp_server.__main__:main"

[[tool.uv.index]]
default = true
name = "default"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[tool.setuptools.packages.find]
where = ["src"]
include = ["xqtrader*", "agent*", "mcp_server*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["framework", "xqtrader", "agent", "mcp_server"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["framework", "xqtrader", "agent", "mcp_server", "skills"]

[[tool.mypy.overrides]]
module = ["psycopg2", "psycopg.*", "xtquant.*", "langgraph.checkpoint.postgres", "nanobot.*", "mcp.*", "backtrader", "quantstats", "quantstats.*", "akshare", "akshare.*", "qdrant_client", "qdrant_client.*", "sentence_transformers", "sentence_transformers.*", "framework.dal.transactional"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-v"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = [
    "ignore:datetime.datetime.utcnow:DeprecationWarning:backtrader",
    "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning:xtquant",
]
