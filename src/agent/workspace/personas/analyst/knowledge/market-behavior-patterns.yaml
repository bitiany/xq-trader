# 市场行为图谱与行为金融常识
#
# 定位：资深金融分析师员工的专业素养知识库（非用户心理干预工具）
# 用途：
#   1. 市场行为面分析 — 识别市场参与者群体行为偏差，作为投研/择时/事件分析维度
#   2. 建议中的客观提示 — 在交易建议中自然融入行为金融常识，作为专业建议的一部分
#
# 使用规范：
#   - 仅在分析市场行为或给出交易建议时按需 read_file 引用
#   - 不主动询问/检测/构建用户心理状态
#   - 不写入数据库，不跨会话记忆用户心理
#   - 行为偏差提示是分析师专业建议的一部分，不是对用户心理状态的干预

# ============================================================
# 第一部分：市场参与者群体行为模式
# 用途：市场行为面分析（当市场指标显示群体行为极端化时引用）
# ============================================================

market_participant_behaviors:

  herd_effect:
    name: 羊群效应
    description: 市场参与者跟随群体行为，导致价格过度偏离基本面
    market_signals:
      - 涨跌停家数比极端（>10:1 或 <1:10）
      - 成交量异常放大伴随指数单边走势
      - 板块普涨/普跌缺乏分化
      - 龙虎榜机构席位集中同向操作
    analyst_note: |
      当观察到群体行为极端化时，反向波动风险升高。
      建议在分析报告中明确提示「行为面风险」，
      并结合持仓结构、北向资金流向等辅助判断反转概率。

  overreaction:
    name: 过度反应
    description: 市场对消息过度反应，常在事件后出现均值回归
    market_signals:
      - 事件后单日跌幅/涨幅超过历史波动 2σ
      - VIX/恐慌指数飙升但基本面未实质恶化
      - 个股开盘跳空后盘中回补
    analyst_note: |
      过度反应后常现均值回归。
      在事件驱动报告中可提示「短期超跌/超涨反弹概率」，
      并区分：基本面未变 → 均值回归概率高；
      基本面实质恶化 → 趋势延续，需谨慎抄底。

  disposition_effect:
    name: 处置效应
    description: 投资者倾向于过早卖出盈利资产、过久持有亏损资产
    market_signals:
      - 个股放量上涨后缩量回调（盈利盘过早止盈）
      - 持仓股深套后成交量萎缩（亏损盘不愿止损）
      - 龙虎榜显示散户主导的标的换手率异常
    analyst_note: |
      在交易建议中可客观提示：当前价位易触发处置效应，
      建议明确止盈/止损纪律。
      这是分析师专业建议的一部分，不是对用户心理状态的干预。

  panic_selling:
    name: 恐慌性抛售
    description: 市场参与者因恐慌而集中抛售，常出现在重大利空后
    market_signals:
      - 大盘单日跌幅 >3% 且成交量放大 1.5 倍以上
      - 恐慌指数（VIX/A股情绪指标）突破阈值
      - 融资盘强平导致的踩踏（融资余额骤降）
    analyst_note: |
      恐慌性抛售常现 V 型反弹（基本面未恶化时）。
      分析报告中可提示「恐慌底」概率，
      但需结合：融资盘是否出清、政策面是否对冲、估值是否到位。

  fomo_chase:
    name: 追涨行为（FOMO）
    description: 市场参与者因害怕踏空而追高，常出现在题材股主升浪末期
    market_signals:
      - 题材股连续涨停后放量滞涨
      - 社交媒体/财经媒体热度异常升高
      - 散户开户数/活跃度激增
    analyst_note: |
      追涨行为常现高位接盘风险。
      在择时报告中可提示「主升浪末期风险」，
      并结合：龙头股是否滞涨、量价是否背离、换手率是否异常。

# ============================================================
# 第二部分：行为金融常识参考
# 用途：建议中的客观提示（在交易建议中自然融入，作为专业建议的一部分）
# ============================================================

behavioral_biases_reference:

  loss_aversion:
    name: 损失厌恶
    description: 投资者对损失的痛苦感约为同等收益快乐感的 2 倍（前景理论）
    applicable_scene: 仓位建议、风险提示
    objective_note: |
      此处建议保守仓位，因投资者对亏损的承受力低于数学期望。
      建议在止损纪律明确的前提下再考虑入场。

  anchoring:
    name: 锚定效应
    description: 投资者过度依赖首次获得的信息（如历史高点/低点）作为决策锚
    applicable_scene: 估值分析、入场点位建议
    objective_note: |
      当前价格距历史高点 X%，需警惕锚定历史高点导致的估值误判。
      建议结合近 5 年估值分位与基本面变化综合判断。

  recency_bias:
    name: 近因偏差
    description: 投资者过度重视近期事件，忽视长期规律
    applicable_scene: 趋势分析、事件驱动
    objective_note: |
      近期事件权重过高，需结合 5 年历史分位评估长期估值。
      短期波动不改变长期趋势，避免追涨杀跌。

  overconfidence:
    name: 过度自信
    description: 投资者高估自己判断准确性，导致仓位过重
    applicable_scene: 仓位建议、择时
    objective_note: |
      建议分批建仓而非一次性重仓，控制单一判断的仓位风险。
      单一标的仓位不超过总仓位的 X%（按风险偏好调整）。

  confirmation_bias:
    name: 确认偏差
    description: 投资者倾向于寻找支持自己观点的信息，忽视反面证据
    applicable_scene: 投研分析、论点卡构建
    objective_note: |
      在构建论点卡时，建议同步列出证伪条件，
      避免只看利好忽视利空。分析师应主动提示反面证据。

  endowment_effect:
    name: 禀赋效应
    description: 投资者对自己持有的标的估值高于市场价，不愿卖出
    applicable_scene: 持仓分析、调仓建议
    objective_note: |
      持仓标的的估值应以市场价为准，而非成本价。
      建议定期审视持仓，对不符合当前逻辑的标的果断调出。

  sunk_cost_fallacy:
    name: 沉没成本谬误
    description: 投资者因已投入的成本而继续持有亏损标的
    applicable_scene: 止损建议、持仓调整
    objective_note: |
      止损决策应基于未来预期，而非已发生的亏损。
      若逻辑已破坏，建议果断止损，避免因沉没成本继续持有。

  availability_heuristic:
    name: 易得性启发
    description: 投资者过度依赖容易回忆的事件做判断（如近期大跌或大涨）
    applicable_scene: 风险评估、事件驱动
    objective_note: |
      近期事件易得性高，但不应主导风险评估。
      建议结合历史波动率与概率分布评估风险。

# ============================================================
# 第三部分：分析师使用指南
# ============================================================

usage_guidelines:

  when_to_reference:
    - 市场行为指标（涨跌停比、VIX、恐慌指数、成交量）显示极端化时
    - 交易建议涉及止盈/止损/仓位管理时
    - 事件驱动分析中判断过度反应时
    - 论点卡构建时提示确认偏差风险

  when_not_to_reference:
    - 不主动询问用户情绪状态
    - 不构建用户心理画像
    - 不在专业报告中夹带对用户心理的评述
    - 不用"你现在的心理状态是..."等表述

  tone:
    - 客观、专业，作为分析师专业建议的一部分
    - 例：「当前涨跌停比 12:1，羊群效应显著，反向波动风险升高」
    - 反例（禁止）：「你现在的情绪可能让你想追涨，建议冷静」
