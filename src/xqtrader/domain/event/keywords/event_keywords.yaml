# 事件关键词库 — EventDetector Layer 1 快速检测（毫秒级）
#
# 三大类事件：利好 / 利空 / 政策
# 每个事件类型对应多个关键词，任一关键词命中即判定为该事件类型
#
# 架构文档 §11.3.1 第一层：关键词快速检测

利好:
  资产重组:
    - 资产重组
    - 重大资产
    - 借壳上市
    - 资产注入
    - 重大资产重组
    - 重大资产购买
    - 重大资产出售
  回购增持:
    - 回购
    - 增持
    - 股份回购
    - 大股东增持
    - 实控人增持
    - 回购股份
    - 增持计划
  业绩预增:
    - 业绩预增
    - 业绩大增
    - 净利润增长
    - 扭亏为盈
    - 业绩预盈
    - 业绩大幅增长

利空:
  股东减持:
    - 减持
    - 股东减持
    - 高管减持
    - 清仓
    - 清仓式减持
    - 减持计划
    - 大股东减持
  业绩预减:
    - 业绩预减
    - 业绩下滑
    - 亏损
    - 营收下降
    - 业绩预亏
    - 业绩大幅下降
    - 净利润下降
  违规处罚:
    - 违规
    - 处罚
    - 立案调查
    - 行政处罚
    - 证监会处罚
    - 交易所处分
    - 警示函
  退市风险:
    - 退市
    - 退市风险警示
    - "*ST"
    - 风险警示
    - 终止上市
