name: daily_incremental
celery_task_name: market.daily_incremental_collect
version: "1.0.0"
task_name: 全市场个股日频增量采集
task_name_en: Stock Daily Incremental Collection
description: 全市场个股维度：按日期增量采集日 K 线、资金流向、每日指标，各 Stage 独立完成采集→清洗→持久化→水位更新。指数与申万行业见独立插件 index_daily / sw_daily，日频编排在 schedules/daily_pipeline.yml
description_en: Stock universe incremental collection for daily kline, fund flow and daily indicator; index and SW industry are separate plugins orchestrated in daily_pipeline.yml
category: io
task_type: on_demand
queue: market
timeout: 43200
retry_config:
  max_retries: 2
  retry_backoff: true
  retry_backoff_max: 600
params_schema:
  type: object
  properties:
    start_date:
      type: string
      title: 采集起始日期
      description: 格式 YYYY-MM-DD，为空时按市场水位日期增量采集
    kline_batch_size:
      type: integer
      title: QMT标的分片大小
      default: 50
