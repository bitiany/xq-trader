name: daily_incremental
celery_task_name: market.daily_incremental_collect
version: "1.0.0"
task_name: 日行情与资金流向及指标增量采集
task_name_en: Daily Incremental Collection
description: 按日期增量采集全市场日行情K线、资金流向、每日指标、指数行情和申万行业行情数据，每个数据类型独立完成采集→清洗→持久化→更新水位闭环
description_en: Incrementally collect daily kline, fund flow, daily indicator, index daily and SW industry data by date, each data type independently completes collect→clean→persist→update watermark cycle
category: io
task_type: on_demand
queue: market
timeout: 43200
retry_config:
  max_retries: 2
  retry_backoff: true
  retry_backoff_max: 600
params_schema:
  type: object
  properties:
    start_date:
      type: string
      title: 采集起始日期
      description: 格式 YYYY-MM-DD，为空时按市场水位日期增量采集
    kline_batch_size:
      type: integer
      title: QMT标的分片大小
      default: 50