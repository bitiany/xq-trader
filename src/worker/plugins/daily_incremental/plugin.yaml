name: daily_incremental
celery_task_name: market.daily_incremental_collect
version: "1.0.0"
task_name: 日行情与资金流向增量采集
task_name_en: Daily Incremental Collection
description: 按日期增量采集全市场日行情K线和资金流向数据，每个数据类型独立完成采集→清洗→持久化→更新水位闭环
category: io
task_type: on_demand
queue: market
timeout: 7200
retry_config:
  max_retries: 2
  retry_backoff: true
  retry_backoff_max: 600
params_schema:
  type: object
  properties:
    start_date:
      type: string
      title: 采集起始日期
      description: 格式 YYYY-MM-DD，为空时按市场水位日期增量采集
    end_date:
      type: string
      title: 采集结束日期
      description: 格式 YYYY-MM-DD，为空时取最新交易日
    kline_batch_size:
      type: integer
      title: QMT标的分片大小
      default: 50
