name: index_daily
celery_task_name: market.index_daily_collect
version: "1.0.0"
task_name: 指数日线行情采集
task_name_en: Index Daily Kline Collection
description: 逐标的采集全市场指数日线行情数据，数据源为QMT，支持增量采集和水位管理
description_en: Per-security collection of index daily kline data from QMT with incremental collection and watermark management
category: io
task_type: on_demand
queue: market
timeout: 43200
retry_config:
  max_retries: 2
  retry_backoff: true
  retry_backoff_max: 600
params_schema:
  type: object
  properties:
    pipeline_name:
      type: string
      title: 管线名称
      default: "index_daily"
    concurrency:
      type: integer
      title: 并发数
      default: 5
    index_codes:
      type: array
      items:
        type: string
      title: 指数代码列表
      description: 为空时采集全市场指数
    max_count:
      type: integer
      title: 最大标的数量
      default: 0
    collect_date:
      type: string
      title: 采集起始日期
