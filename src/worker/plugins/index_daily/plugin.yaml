name: index_daily
celery_task_name: market.index_daily_collect
version: "1.0.0"
task_name: 全市场指数日线增量采集
task_name_en: Index Universe Daily Collection
description: 指数维度独立插件：逐标的采集全市场指数日线（Tushare index_daily），下载→清洗→持久化→水位更新均在任务内闭环。日频编排在 schedules/daily_pipeline.yml
description_en: Index universe plugin — per-index daily kline from Tushare with full in-task watermark lifecycle; orchestrated in daily_pipeline.yml
category: io
task_type: on_demand
queue: market
timeout: 43200
retry_config:
  max_retries: 2
  retry_backoff: true
  retry_backoff_max: 600
params_schema:
  type: object
  properties:
    pipeline_name:
      type: string
      title: 管线名称
      default: "index_daily"
    concurrency:
      type: integer
      title: 并发数
      default: 5
    index_codes:
      type: array
      items:
        type: string
      title: 指数代码列表
      description: 为空时采集全市场指数
    max_count:
      type: integer
      title: 最大标的数量
      default: 0
    collect_date:
      type: string
      title: 采集起始日期
