name: factor_compute
celery_task_name: factor.compute_daily
version: "1.0.0"
task_name: 因子日频计算
task_name_en: Daily Factor Computation
description: 基于Pipeline引擎计算全市场股票因子值，支持多因子插件并发计算
category: compute
task_type: on_demand
queue: celery
timeout: 7200
retry_config:
  max_retries: 2
  retry_backoff: true
  retry_backoff_max: 600
params_schema:
  type: object
  properties:
    start_date:
      type: string
      title: 起始日期
      description: 全量回补起始日期（格式 YYYY-MM-DD），覆盖水位
    trade_date:
      type: string
      title: 交易日期
      description: 指定计算日期（格式 YYYY-MM-DD），为空时取最新交易日
    stock_codes:
      type: array
      title: 股票代码列表
      description: 为空时计算全市场
      items:
        type: string
    max_count:
      type: integer
      title: 最大标的数量
      description: 用于测试，0 表示不限
      default: 0
    concurrency:
      type: integer
      title: 并发数
      default: 5
    factor_ids:
      type: array
      title: 因子ID列表
      description: 为空时计算全部已注册因子
      items:
        type: string
