name: factor_evaluate
celery_task_name: factor.evaluate_daily
version: "1.0.0"
task_name: 因子日频评估
task_name_en: Daily Factor Evaluate
description: 计算因子IC/ICIR/换手率/因子等级等统计指标，截面预处理（MAD+Z-score+行业中性化）
category: compute
task_type: on_demand
queue: factor
timeout: 1800
retry_config:
  max_retries: 2
  retry_backoff: true
  retry_backoff_max: 600
params_schema:
  type: object
  properties:
    trade_date:
      type: string
      title: 交易日期
      description: 指定评估日期（格式 YYYY-MM-DD），为空时取最新交易日
    window:
      type: integer
      title: 滚动窗口
      description: IC 计算滚动窗口（交易日），默认252
      default: 252
    pool_id:
      type: string
      title: 样本池标识
      description: 样本池标识，默认 all
      default: all
