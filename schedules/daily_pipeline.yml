name: daily_pipeline
description: "日频流水线：采集 → 因子计算 → ML因子推理"
mode: canvas
queue: celery
enabled: true

steps:
  - name: stock_daily_collect
    task: market.daily-incremental-collect
    args: {}

  - name: index_daily_collect
    task: market.index_daily_collect
    depends_on: [stock_daily_collect]
    args: {}

  - name: sw_daily_collect
    task: market.sw_daily_collect
    depends_on: [index_daily_collect]
    args: {}

  - name: daily_factor_compute
    task: factor.compute_daily
    depends_on: [sw_daily_collect]
    args:
      mode: incremental

  - name: ml_predict
    task: ml.predict_daily
    depends_on: [daily_factor_compute]
    args:
      pool_ids: ["idx_300"]
      factor_id: "ml_alpha_v1"

  - name: stock_diagnosis_snapshot
    task: market.stock_diagnosis_snapshot
    depends_on: [daily_factor_compute]
    args: {}
